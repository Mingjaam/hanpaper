name: build

# Every push builds both apps. A tag like v1.0.1 also publishes a GitHub Release with the installers
# (Hanpaper-Setup.exe, Hanpaper.dmg) and portable zips, which the README and the website link to.
# Pushes to main deploy the website (site/) to GitHub Pages.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: python -m pip install -r requirements.txt pyinstaller Pillow
      - name: Smoke test (analysis + Korean re-typesetting)
        run: python packaging/smoke_test.py
      - name: Build app
        shell: pwsh
        run: |
          python packaging/make_icon.py
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging/hanpaper.spec
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path dist/Hanpaper -DestinationPath out/Hanpaper-windows-x64.zip
      - name: Installer
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0" }
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_4_3/innosetup-6.4.3.exe -OutFile innosetup.exe
          Start-Process ./innosetup.exe -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /DIR="C:\inno" /NOICONS' -Wait
          & C:\inno\ISCC.exe /Q "/DAppVersion=$version" packaging\installer.iss
          Copy-Item packaging\Output\Hanpaper-Setup.exe out\
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            out/Hanpaper-Setup.exe
            out/Hanpaper-windows-x64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Smoke test
        run: |
          python -m pip install -r requirements.txt
          python packaging/smoke_test.py
      - name: Import signing certificate
        # Skipped quietly when the secrets are not set (forks, or before the certificate is added).
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$MAC_CERT_P12" ]; then echo "No signing certificate; building with an ad-hoc signature."; exit 0; fi
          if [ -z "$MAC_CERT_PASSWORD" ]; then echo "::warning::MAC_CERT_PASSWORD is not set; building with an ad-hoc signature."; exit 0; fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          # Newer runner images lack Apple's Developer ID intermediate, without which the identity is not "valid"
          for ca in DeveloperIDG2CA AppleWWDRCAG3; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer" && \
              security import "$RUNNER_TEMP/$ca.cer" -k "$keychain" -T /usr/bin/codesign || true
          done
          security find-identity -p codesigning "$keychain" | sed -E 's/[0-9A-F]{40}/<hash>/'
          identity=$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          if [ -z "$identity" ]; then echo "::error::No Developer ID Application identity in the certificate"; exit 1; fi
          echo "MAC_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "Signing as: $identity"
      - name: Build app
        env:
          PYTHON: python
          MAC_NOTARY_KEY: ${{ secrets.MAC_NOTARY_KEY }}
          MAC_NOTARY_KEY_ID: ${{ secrets.MAC_NOTARY_KEY_ID }}
          MAC_NOTARY_ISSUER: ${{ secrets.MAC_NOTARY_ISSUER }}
        run: |
          if [ -n "$MAC_NOTARY_KEY" ] && [ -n "$MAC_SIGN_IDENTITY" ]; then
            echo "$MAC_NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            export MAC_NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8"
          fi
          bash packaging/build_mac.sh
      - name: Check bundle
        run: |
          test -x dist/Hanpaper.app/Contents/MacOS/Hanpaper
          test -d dist/Hanpaper.app/Contents/Resources || test -d dist/Hanpaper.app/Contents/Frameworks
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/Hanpaper.dmg
            dist/Hanpaper-macos.zip

  release:
    if: github.ref_type == 'tag'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/Hanpaper-Setup.exe
            out/Hanpaper.dmg
            out/Hanpaper-windows-x64.zip
            out/Hanpaper-macos.zip
          generate_release_notes: true

  site:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
